name: Publicar ERP en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias y comprobar procesos
        run: |
          npm ci
          npm test
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Preparar frontend
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ./*.css ./*.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
